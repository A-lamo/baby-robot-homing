[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bachlor-project"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
training = ["ariel"]
hardware = ["picamera2"]

[tool.uv.sources]
ariel = { path = "ariel", editable = true }

[tool.setuptools.packages.find]
include = ["blocks*"]
